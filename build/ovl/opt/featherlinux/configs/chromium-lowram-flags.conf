# Chromium / Thorium / Ungoogled-Chromium Low-RAM Flags for Old Laptops
# Installed to: /etc/chromium/chromium.conf or ~/.config/chromium-flags.conf

# Group tabs from the same site into a single process to cut RAM usage by 40-60%
--process-per-site

# Limit active renderer processes (critical on 1GB - 4GB RAM systems)
--renderer-process-limit=4

# Enable high-efficiency memory saver & battery saver modes by default
--enable-features=HighEfficiencyModeAvailable,BatterySaverModeAvailable,VaapiVideoDecoder

# Reduce GPU/skia cache footprints
--gpu-program-cache-size-kb=2048
--disable-gpu-shader-disk-cache

# Disable background networking & speculative pre-rendering that wastes RAM/CPU
--disable-background-networking
--disable-ipc-flooding-protection
--disk-cache-size=67108864
