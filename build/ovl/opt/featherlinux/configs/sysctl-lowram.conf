# FeatherLinux Kernel & Virtual Memory Tuning for Low-RAM Laptops
# Installed to: /etc/sysctl.d/99-feather-lowram.conf

# Maximize use of fast in-RAM zstd compressed swap (zram) before touching slow HDD/SSD
vm.swappiness = 180

# Page-cluster = 0 disables swap readahead overhead (optimal for random-access zram)
vm.page-cluster = 0

# Reclaim dentries and inodes slightly faster so RAM stays free for apps
vm.vfs_cache_pressure = 125

# Prevent large disk writes from stalling interactive UI responsiveness on slow laptop drives
vm.dirty_background_ratio = 3
vm.dirty_ratio = 10

# Boost watermark scale factor to prevent direct reclaim spikes/stutters
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
